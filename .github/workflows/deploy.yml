# Per-service DEPLOY (the genuinely-new layer — nothing deployed before).
# Copy to each service repo at: .github/workflows/deploy.yml  (edit `service:`)
# Runs on push to development (after build.yml passed): image -> Trivy -> ECR -> SSM.
name: deploy

on:
  push:
    branches: [development]

jobs:
  deploy:
    # OIDC to AWS: the calling job must grant id-token so the reusable can use it.
    permissions:
      id-token: write
      contents: read
    uses: resto-panda/devops/.github/workflows/deploy-service.yml@development
    with:
      service: realtime-gateway      # <-- change per repo
      block-on-vuln: false        # dev: Trivy warns but doesn't block (base-image CVEs). Re-enable after patching.
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
